name: prices
# Hourly OHLCV for census pools at fixed age milestones (see prices.py). Idle until pools reach 41 days.
# Work is split across NSHARDS parallel runners (GeckoTerminal allows ~5 calls/min per runner IP). After all shards
# finish, the chain job dispatches the next run if work remains; the 6-hourly schedule is the watchdog.
on:
  workflow_dispatch:
    inputs:
      test:
        description: "Smoke test: 20 pools, 30-min milestone, release ohlcv-test-*, log ohlcv_log_test/"
        type: boolean
        default: false
  schedule:
    - cron: "23 */6 * * *"
permissions:
  contents: write
  actions: write
concurrency:
  group: prices
  cancel-in-progress: false
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - run: pip install -q pandas pyarrow
      - run: python3 test_prices.py
      - name: Pull due OHLCV
        id: pull
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRICES_TEST: ${{ inputs.test && '1' || '0' }}
          RUN_MIN: ${{ inputs.test && '5' || '330' }}
          FLUSH_MIN: "30"
          CALLS_PER_MIN: "25"
          SHARD: ${{ matrix.shard }}
          NSHARDS: "3"
        run: |
          git config user.name "meme-census-bot"
          git config user.email "meme-census-bot@users.noreply.github.com"
          python3 prices.py
  chain:
    needs: pull
    if: ${{ !cancelled() && needs.pull.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - run: pip install -q pandas pyarrow
      - name: Count remaining due milestones
        id: rem
        env:
          PRICES_TEST: ${{ inputs.test && '1' || '0' }}
          MIN_CHAIN: "600"
        run: python3 prices.py --remaining
      - name: Dispatch next run if work remains
        if: steps.rem.outputs.more == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/prices.yml/dispatches" \
            -d '{"ref":"main"}'
